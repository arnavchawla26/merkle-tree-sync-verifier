[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merkle-tree-sync-verifier"
version = "0.1.0"
description = "Content-addressed Merkle tree over a directory: log-depth diffing and trusted-manifest verification for syncing and replica integrity checks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyflakes>=3.0"]

[project.scripts]
merkletree = "merkletree.cli:main"

[tool.setuptools]
packages = ["merkletree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
